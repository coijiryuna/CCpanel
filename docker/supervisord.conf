[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php8.1-fpm]
command=/usr/sbin/php-fpm8.1 -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php8.2-fpm]
command=/usr/sbin/php-fpm8.2 -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php8.3-fpm]
command=/usr/sbin/php-fpm8.3 -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ccpanel]
command=/opt/ccpanel/.venv/bin/uvicorn server:app --host 127.0.0.1 --port 8888
directory=/opt/ccpanel
environment=PANEL_PASSWORD="%(ENV_PANEL_PASSWORD)s",PANEL_JWT_SECRET="%(ENV_PANEL_JWT_SECRET)s",CCPANEL_CERTBOT_EMAIL="%(ENV_CCPANEL_CERTBOT_EMAIL)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
